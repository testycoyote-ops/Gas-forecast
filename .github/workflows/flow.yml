name: Market flow

# Kalshi's daily gas markets trade all day and settle at 11:59pm ET, so the flow
# page is worth refreshing far more often than the price page. Public repos get
# unlimited Actions minutes, so this is free; GitHub's scheduler is imprecise by
# 5-20 minutes, which does not matter here.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gas-forecast-commit
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch market flow and rebuild the edge page
        run: python flow.py

      - name: Commit if anything changed
        run: |
          git config user.name  "gas-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update market flow $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi
