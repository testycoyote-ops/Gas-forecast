name: Backfill history

# One-shot, manual only. Reconstructs AAA daily history from archived snapshots
# of gasprices.aaa.com and recalibrates the model on the result. Run it from the
# Actions tab -> "Backfill history" -> "Run workflow".
#
# Not on a schedule on purpose: it rewrites history.csv, which everything else
# depends on, and it hammers a free archive service. Run it deliberately.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date, YYYYMMDD"
        required: true
        default: "20250101"
      end:
        description: "End date, YYYYMMDD (blank = today)"
        required: false
        default: ""
      fuzzy:
        description: "Also take month-ago/year-ago fields (less reliable dating)"
        type: boolean
        default: false
      dry_run:
        description: "Report what it would do without writing history.csv"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gas-forecast-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Wayback is slow and this walks a lot of snapshots.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reconstruct history from archived snapshots
        run: |
          python backfill.py \
            --start "${{ inputs.start }}" \
            ${{ inputs.end && format('--end {0}', inputs.end) || '' }} \
            ${{ inputs.fuzzy && '--fuzzy' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the page against the new history
        if: ${{ !inputs.dry_run }}
        run: python build.py

      - name: Commit if anything changed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "gas-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Backfill AAA history from archived snapshots"
            git pull --rebase --autostash origin main
            git push
          fi
