name: Update forecast

on:
  schedule:
    # AAA publishes the new national average overnight ET. Two attempts a day:
    # the second is a free retry if the first one runs before AAA has updated,
    # or if GitHub delays the cron (it often does by 5-20 minutes).
    - cron: "20 11 * * *"   # ~7:20am ET
    - cron: "20 16 * * *"   # ~12:20pm ET
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices and rebuild the page
        run: python build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "gas-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update forecast $(date -u +%Y-%m-%d)"
            git push
          fi
